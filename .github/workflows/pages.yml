name: Web app (GitHub Pages)

# Builds the web app with the sign-in and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/stratum-4d/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app with sign-in
        env:
          # SHA-256 of "user:password". Change it to change the sign-in.
          VITE_LOGIN_HASH: 47178b2cffdab4e520ea04dc0a2c8c0e0761b01558e2602c19b78f346dc83ef1
          # OAuth client ids for the cloud folder (repository variables; public values).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        run: npx vite build && touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Publish web app
