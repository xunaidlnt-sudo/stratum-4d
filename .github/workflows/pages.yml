name: Web app (GitHub Pages)

# Builds the Miqyas Labs website (site/), the web app with the sign-in (/demo)
# and the user manual (/manual), and publishes them to Cloudflare Pages (when the
# Cloudflare secrets exist) and to the gh-pages branch (backup).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Set when the Cloudflare secrets exist (see scripts/cloudflare/setup.sh).
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app with sign-in
        env:
          # SHA-256 of "user:password". Change it to change the sign-in.
          VITE_LOGIN_HASH: 47178b2cffdab4e520ea04dc0a2c8c0e0761b01558e2602c19b78f346dc83ef1
          # Public demo account, shown on the sign-in page with copy buttons.
          VITE_DEMO_USER: demo
          VITE_DEMO_PASS: Stratum4D-Demo
          # Each visitor gets a fresh copy of the sample projects (functions/api/demo, D1).
          VITE_DEMO_SESSIONS: "1"
          # OAuth client ids for the cloud folder (repository variables; public values).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        run: npx vite build
      - name: Assemble the site (website at the root, demo in /demo, manual in /manual)
        run: |
          node scripts/manual/build.cjs --no-pdf
          npx esbuild site/hero/main.tsx --bundle --minify --format=esm --target=es2020 --jsx=automatic --loader:.css=css --external:manual/* --outfile=site/hero.js --log-level=warning
          mkdir -p public_site
          cp -r site/. public_site/
          rm -rf public_site/hero
          cp brand/miqyas-labs.png brand/miqyas-labs-dark.png brand/stratum-lockup.png public_site/
          cp -r dist public_site/demo
          cp -r docs/manual/dist public_site/manual
          cp docs/Stratum-4D-Manual.pdf public_site/manual/
          touch public_site/.nojekyll
      # The Cloudflare copy serves the installers itself at /downloads (functions/downloads, R2 bucket).
      # The GitHub copy (backup) links to the bucket's public r2.dev address, or to GitHub Releases.
      - name: Download links
        run: |
          cp -r public_site public_cf
          rm -f public_cf/.nojekyll
          node scripts/cloudflare/links.cjs public_cf/index.html /downloads
          R2DEV=https://pub-9fcb7bb277c74040a4d7ff3a6a07ba7a.r2.dev
          if curl -sf "$R2DEV/latest/latest.json" >/dev/null; then
            node scripts/cloudflare/links.cjs public_site/index.html "$R2DEV/latest"
          else
            echo "The download bucket is not ready: the GitHub copy keeps the GitHub links."
          fi
      # Company firewalls often block GitHub, so the site is served by Cloudflare Pages.
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd90233d3db18e0173d8165819f5e9e98' }}
        run: bash scripts/cloudflare/pages-deploy.sh public_cf
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public_site
          # Custom domain (Cloudflare DNS: four A records to GitHub Pages and www as a CNAME).
          cname: miqyaslabs.com
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Publish web app
