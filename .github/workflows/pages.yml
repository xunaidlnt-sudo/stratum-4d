name: Web app (GitHub Pages)

# Builds the Miqyas Labs website (site/), the web app with the sign-in (/demo)
# and the user manual (/manual), and publishes them to the gh-pages branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app with sign-in
        env:
          # SHA-256 of "user:password". Change it to change the sign-in.
          VITE_LOGIN_HASH: 47178b2cffdab4e520ea04dc0a2c8c0e0761b01558e2602c19b78f346dc83ef1
          # OAuth client ids for the cloud folder (repository variables; public values).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        run: npx vite build
      - name: Assemble the site (website at the root, demo in /demo, manual in /manual)
        run: |
          node scripts/manual/build.cjs --no-pdf
          mkdir -p public_site
          cp -r site/. public_site/
          cp brand/miqyas-labs.png brand/miqyas-labs-dark.png brand/stratum-lockup.png public_site/
          cp -r dist public_site/demo
          cp -r docs/manual/dist public_site/manual
          cp docs/Stratum-4D-Manual.pdf public_site/manual/
          touch public_site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Publish web app
