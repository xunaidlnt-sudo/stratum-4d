# Builds the Stratum 4D desktop installers on native runners.
#   Windows: NSIS .exe installer
#   macOS:   .dmg (Intel + Apple Silicon)
#   Linux:   .AppImage and .deb
#   Android: .apk (Capacitor) for phones and tablets
# Push to the stratum-4d branch (or main) to get installers as workflow artifacts.
# Push a tag like v0.2.0 to also attach them to a draft GitHub Release, or run
# the workflow by hand with "publish" ticked to tag v<package.json version>
# and publish the release in one go.

name: Desktop installers

on:
  push:
    branches: [stratum-4d, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create tag v<version> from package.json and publish the release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: Windows
          # Intel and Apple Silicon DMGs are built in separate jobs: building both in
          # one job mounts two images under the same volume name and hdiutil fails.
          - os: macos-latest
            target: --mac --x64
            name: macOS-x64
          - os: macos-latest
            target: --mac --arm64
            name: macOS-arm64
          - os: ubuntu-latest
            target: --linux
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build && npm run build:electron

      # GitHub's macOS runners index and scan freshly mounted disk images, which
      # keeps the DMG busy so "hdiutil detach" fails. Stop both before building.
      - name: Free hdiutil on macOS runners
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          for i in $(seq 1 20); do pgrep XProtect >/dev/null || break; sleep 3; done

      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No code-signing certificates yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: stratum-4d-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx vite build
      - name: Create the Android project and icons
        run: |
          npx cap add android
          # Stratum's native plugins (printing) replace the generated MainActivity.
          cp android-src/*.java android/app/src/main/java/com/miqyaslabs/stratum4d/
          mkdir -p assets && cp brand/stratum-icon.png assets/icon-only.png
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#0b2545' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0b2545'
          npx cap sync android
      - name: Set the app version
        run: |
          V=$(node -p 'require("./package.json").version')
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "VERSION=$V" >> "$GITHUB_ENV"
      # With the ANDROID_KEYSTORE secrets set, the APK is signed with your own key so
      # new versions install over old ones; without them it is debug-signed.
      - name: Build APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p release
          cd android
          if [ -n "$KS" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "$KS" | base64 -d > ../ks.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
            "$BT/apksigner" sign --ks ../ks.jks --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out "../release/Stratum-4D-$VERSION-android.apk" ../aligned.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../release/Stratum-4D-$VERSION-android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stratum-4d-Android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true
      # Tag pushes make a draft to review; a manual run with "publish" releases it.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Stratum 4D ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          generate_release_notes: true
          draft: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
