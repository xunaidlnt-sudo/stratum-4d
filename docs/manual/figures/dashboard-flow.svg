<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-label="From a schedule to a dashboard and its reports">
  <style>.t{font:700 17px Montserrat,sans-serif;fill:#0b2545}.h{font:700 13.5px Montserrat,sans-serif;fill:#fff}.s{font:11.5px Inter,sans-serif;fill:#dfe6ee}.o{font:600 12.5px Inter,sans-serif;fill:#0b2545}.m{font:12px Inter,sans-serif;fill:#5d6b7a}</style>
  <rect width="960" height="270" rx="8" fill="#ebecef"/>
  <text class="t" x="24" y="34">Dashboard wizard, then the outputs</text>
  <g>
    <rect x="24" y="58" width="132" height="66" rx="8" fill="#0b2545"/><text class="h" x="90" y="86" text-anchor="middle">1 Project</text><text class="s" x="90" y="106" text-anchor="middle">open or saved</text>
    <rect x="170" y="58" width="132" height="66" rx="8" fill="#183a63"/><text class="h" x="236" y="86" text-anchor="middle">2 Baseline</text><text class="s" x="236" y="106" text-anchor="middle">to compare with</text>
    <rect x="316" y="58" width="132" height="66" rx="8" fill="#355b7d"/><text class="h" x="382" y="86" text-anchor="middle">3 Template</text><text class="s" x="382" y="106" text-anchor="middle">or blank</text>
    <rect x="462" y="58" width="132" height="66" rx="8" fill="#b8874f"/><text class="h" x="528" y="86" text-anchor="middle">4 Check</text><text class="s" x="528" y="106" text-anchor="middle">prerequisites</text>
    <rect x="628" y="50" width="308" height="82" rx="10" fill="#fff" stroke="#e10600" stroke-width="2"/>
    <text x="782" y="84" text-anchor="middle" style="font:700 16px Montserrat,sans-serif;fill:#e10600">Dashboard</text>
    <text class="m" x="782" y="106" text-anchor="middle">Customise: widgets, slicers, page and theme</text>
  </g>
  <g fill="#d4a574"><path d="M157 88l10 3-10 3zM303 88l10 3-10 3zM449 88l10 3-10 3zM596 88l26 3-26 3z"/></g>
  <g stroke="#d4a574" stroke-width="2.5" fill="none"><path d="M690 132v40M760 132v40M830 132v40M900 132v40"/></g>
  <g>
    <rect x="652" y="172" width="76" height="34" rx="6" fill="#fff" stroke="#c9d1db"/><text class="o" x="690" y="194" text-anchor="middle">PDF</text>
    <rect x="722" y="214" width="76" height="34" rx="6" fill="#fff" stroke="#c9d1db"/><text class="o" x="760" y="236" text-anchor="middle">Excel</text>
    <rect x="782" y="172" width="96" height="34" rx="6" fill="#fff" stroke="#c9d1db"/><text class="o" x="830" y="194" text-anchor="middle">PowerPoint</text>
    <rect x="862" y="214" width="76" height="34" rx="6" fill="#fff" stroke="#c9d1db"/><text class="o" x="900" y="236" text-anchor="middle">Email</text>
  </g>
  <text class="m" x="24" y="166">A widget that compares with a baseline shows</text>
  <text class="m" x="24" y="184">"Needs a baseline" until step 4 passes.</text>
  <text class="m" x="24" y="220">Email on a schedule needs the desktop application</text>
  <text class="m" x="24" y="238">or Stratum Server.</text>
</svg>
