<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning &amp; Controls – Stratum Learn</title>
<style>
/* ============================================================
   STRATUM LEARN · PLANNING & CONTROLS — design system (from Planner's Guild)
   Serious, technical. Engineering software, not a toy.
   ============================================================ */
:root{
  --navy:#16325C; --ink:#0E1F2E; --teal:#2C6B8B; --grn:#2E7D52;
  --amb:#B4862F; --red:#B03127; --vio:#5B4B8A; --rule:#C9D3DC;
  --lt:#F2F5F8; --white:#fff; --mute:#5C6B78;
  --disp:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",sans-serif;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  --sbw:236px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); font-size:16px; line-height:1.55;
  color:var(--ink); background:var(--lt);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{font-family:var(--disp); color:var(--navy); margin:0 0 .5em; line-height:1.25; font-weight:700}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px} h4{font-size:15px}
p{margin:0 0 .85em}
a{color:var(--teal)}
code,kbd,.mono,.num{font-family:var(--mono)}
button{font-family:var(--body); font-size:15px; cursor:pointer}
:focus-visible{outline:3px solid var(--amb); outline-offset:2px; border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
#app{display:flex; min-height:100vh}
#sidebar{
  width:var(--sbw); flex:0 0 var(--sbw); background:var(--navy); color:#DCE6F0;
  position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden;
}
#main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column}
#topbar{
  position:sticky; top:0; z-index:40; background:var(--white);
  border-bottom:1px solid var(--rule); padding:8px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
#view{padding:22px 26px 80px; max-width:1080px; width:100%}

/* ---------- sidebar ---------- */
.brand{padding:16px 14px 12px; border-bottom:1px solid #24406E}
.brand b{display:block; font-family:var(--disp); font-size:17px; color:#fff; letter-spacing:.3px}
.brand span{display:block; font-size:12px; color:#93AAC6; font-family:var(--mono); margin-top:2px}
.navgrp{padding:10px 0 4px}
.navgrp>h5{
  font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase;
  color:#7E97B5; padding:6px 14px 4px; margin:0; font-family:var(--disp);
}
.navi{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:0; color:#DCE6F0; padding:7px 14px; font-size:14.5px;
  border-left:3px solid transparent; line-height:1.3;
}
.navi:hover{background:#1E3C6B}
.navi.on{background:#0F2647; border-left-color:var(--amb); color:#fff; font-weight:700}
.navi .ic{
  flex:0 0 20px; height:20px; display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; font-weight:700;
  border:1px solid #3A5A8C; border-radius:3px; color:#A9C0DC;
}
.navi.on .ic{border-color:var(--amb); color:var(--amb)}
.navi.lock{opacity:.42}
.navi .lbl{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.navi .dot{flex:0 0 auto; font-size:11px; font-family:var(--mono)}
.navi .dot.done{color:#63C48C}

/* ---------- topbar chips ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule);
  border-radius:6px; padding:4px 9px; background:var(--white); font-size:13.5px; line-height:1.2;
}
.chip .k{font-size:10px; letter-spacing:.9px; text-transform:uppercase; color:var(--mute); font-family:var(--disp)}
.chip .v{font-family:var(--mono); font-weight:700; color:var(--ink); font-size:14px}
.chip.rank{border-color:var(--navy); background:#EEF3F9}
.chip.rank .v{color:var(--navy)}
.chip.xp .v{color:var(--amb)}
.chip.streak .v{color:var(--red)}
.hearts{display:inline-flex; gap:3px}
.hrt{width:14px;height:14px;display:inline-block}
#xpwrap{flex:1 1 190px; min-width:150px; max-width:320px}
#xpwrap .lab{display:flex; justify-content:space-between; font-size:11px; color:var(--mute); font-family:var(--mono); margin-bottom:3px}
.bar{height:7px; background:#E3E9EF; border-radius:4px; overflow:hidden; border:1px solid var(--rule)}
.bar>i{display:block; height:100%; background:var(--amb); width:0; transition:width .5s ease}
.bar.grn>i{background:var(--grn)} .bar.teal>i{background:var(--teal)}
#menubtn{display:none; border:1px solid var(--rule); background:#fff; border-radius:6px; padding:5px 9px; font-family:var(--mono)}

/* ---------- cards & panels ---------- */
.card{background:var(--white); border:1px solid var(--rule); border-radius:6px; padding:16px 18px; margin:0 0 16px}
.card.pad0{padding:0; overflow:hidden}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
.muted{color:var(--mute)}
.sm{font-size:13.5px}
.xs{font-size:12px}
.center{text-align:center}
.rowbtns{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
hr.sep{border:0; border-top:1px solid var(--rule); margin:18px 0}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--navy); background:var(--navy); color:#fff;
  border-radius:6px; padding:8px 15px; font-weight:700; font-size:14.5px;
}
.btn:hover{background:#1E4478}
.btn.sec{background:var(--white); color:var(--navy)}
.btn.sec:hover{background:#EDF2F8}
.btn.gh{background:transparent; color:var(--mute); border-color:var(--rule)}
.btn.gh:hover{background:var(--lt); color:var(--ink)}
.btn.grn{background:var(--grn); border-color:var(--grn)} .btn.grn:hover{background:#25electric}
.btn.grn:hover{background:#256B44}
.btn.red{background:var(--red); border-color:var(--red)} .btn.red:hover{background:#93281F}
.btn.amb{background:var(--amb); border-color:var(--amb)} .btn.amb:hover{background:#9A722A}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:5px 11px; font-size:13px}
.btn.wide{width:100%; justify-content:center}

/* ---------- tables ---------- */
table.dt{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px}
table.dt th,table.dt td{border:1px solid var(--rule); padding:5px 8px; text-align:left; vertical-align:top}
table.dt th{background:var(--lt); font-family:var(--disp); font-size:11.5px; letter-spacing:.4px; text-transform:uppercase; color:var(--navy); font-weight:700}
table.dt tbody tr:nth-child(even){background:#FAFCFD}
table.dt td.n{text-align:right}
.tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}

/* ---------- callouts ---------- */
.co{border:1px solid var(--rule); border-left-width:4px; border-radius:5px; padding:11px 14px; margin:0 0 14px; background:var(--white)}
.co b.t{display:block; font-family:var(--disp); font-size:12.5px; letter-spacing:.5px; text-transform:uppercase; margin-bottom:3px}
.co p:last-child{margin-bottom:0}
.co.ok{border-left-color:var(--grn); background:#F2F9F5} .co.ok b.t{color:var(--grn)}
.co.warn{border-left-color:var(--red); background:#FDF4F3} .co.warn b.t{color:var(--red)}
.co.tip{border-left-color:var(--amb); background:#FCF8EF} .co.tip b.t{color:var(--amb)}
.co.def{border-left-color:var(--vio); background:#F6F4FA} .co.def b.t{color:var(--vio)}
.co.say{border-left-color:var(--teal); background:#F1F7FA} .co.say b.t{color:var(--teal)}
.co.say q{font-style:italic; display:block}
.fx{
  font-family:var(--mono); background:#0E1F2E; color:#D7E6F2; border-radius:5px;
  padding:10px 13px; margin:0 0 14px; font-size:13.5px; overflow-x:auto; white-space:pre-wrap;
}
.fx b{color:var(--amb); font-weight:700}

/* ---------- lesson body ---------- */
.lb h3{margin-top:1.4em; padding-bottom:4px; border-bottom:1px solid var(--rule)}
.lb h3:first-child{margin-top:0}
.lb ul,.lb ol{margin:0 0 .9em; padding-left:22px}
.lb li{margin-bottom:.32em}
.lb strong{color:var(--navy)}
.kbd{font-family:var(--mono); background:var(--lt); border:1px solid var(--rule); border-radius:3px; padding:0 4px; font-size:.92em}

/* ---------- question block ---------- */
.qbox{border:1px solid var(--navy); border-radius:6px; background:var(--white); overflow:hidden; margin:18px 0 0}
.qbox>.hd{background:var(--navy); color:#fff; padding:7px 14px; font-family:var(--disp); font-size:12.5px; letter-spacing:1px; text-transform:uppercase; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.qbox>.hd .xpv{color:#F0CC7A; font-family:var(--mono)}
.qbox>.bd{padding:14px 16px}
.opt{
  display:block; width:100%; text-align:left; background:var(--white); border:1px solid var(--rule);
  border-radius:5px; padding:9px 12px; margin-bottom:8px; font-size:14.5px; line-height:1.4;
}
.opt:hover:not(:disabled){border-color:var(--teal); background:#F4F9FB}
.opt .mk{font-family:var(--mono); font-weight:700; color:var(--mute); margin-right:8px}
.opt.right{border-color:var(--grn); background:#EFF8F3} .opt.right .mk{color:var(--grn)}
.opt.wrong{border-color:var(--red); background:#FCF2F1} .opt.wrong .mk{color:var(--red)}
.opt:disabled{cursor:default}
.numin{font-family:var(--mono); font-size:16px; padding:7px 10px; border:1px solid var(--rule); border-radius:5px; width:130px; background:var(--white); color:var(--ink)}
.numin:focus{border-color:var(--teal)}
.verdict{border-radius:5px; padding:10px 13px; margin-top:11px; font-size:14.5px}
.verdict.ok{background:#EFF8F3; border:1px solid var(--grn)}
.verdict.no{background:#FCF2F1; border:1px solid var(--red)}
.verdict.hint{background:#FCF8EF; border:1px solid var(--amb)}
.verdict b{display:block; font-family:var(--disp); margin-bottom:2px}

/* ---------- widget shell ---------- */
.wg{border:1px solid var(--teal); border-radius:6px; background:var(--white); margin:18px 0; overflow:hidden}
.wg>.hd{background:#EAF2F6; border-bottom:1px solid var(--rule); padding:8px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.wg>.hd b{font-family:var(--disp); font-size:13px; letter-spacing:.6px; text-transform:uppercase; color:var(--teal)}
.wg>.hd .tag{font-family:var(--mono); font-size:11px; color:var(--mute)}
.wg>.bd{padding:14px}
.ctrls{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:13px}
.fld{display:flex; flex-direction:column; gap:3px}
.fld label{font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--mute); font-family:var(--disp); font-weight:700}
.fld input[type=number],.fld input[type=text],.fld select{
  font-family:var(--mono); font-size:14px; padding:5px 8px; border:1px solid var(--rule);
  border-radius:4px; background:var(--white); color:var(--ink); width:100%;
}
.fld input[type=range]{width:100%; accent-color:var(--teal)}
.fld .rv{font-family:var(--mono); font-size:12px; color:var(--teal); font-weight:700}
canvas{display:block; max-width:100%}
.cvwrap{border:1px solid var(--rule); border-radius:5px; background:var(--white); overflow:hidden}
.out{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:9px; margin-top:12px}
.kpi{border:1px solid var(--rule); border-radius:5px; padding:7px 9px; background:var(--lt)}
.kpi .k{font-size:10px; letter-spacing:.7px; text-transform:uppercase; color:var(--mute); font-family:var(--disp); font-weight:700; display:block}
.kpi .v{font-family:var(--mono); font-size:17px; font-weight:700; color:var(--navy); display:block; line-height:1.25}
.kpi.good .v{color:var(--grn)} .kpi.bad .v{color:var(--red)} .kpi.warn .v{color:var(--amb)}
.kpi .s{font-size:11px; color:var(--mute); font-family:var(--mono)}
.chalbar{border-top:1px solid var(--rule); background:#FCF8EF; padding:9px 14px; font-size:13.5px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.chalbar .tg{font-family:var(--disp); font-size:11px; letter-spacing:.7px; text-transform:uppercase; color:var(--amb); font-weight:700}
.chalbar.done{background:#EFF8F3} .chalbar.done .tg{color:var(--grn)}

/* ---------- skill tree ---------- */
#tree{width:100%; display:block}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--mute); margin-top:8px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}

/* ---------- badges ---------- */
.bg{border:1px solid var(--rule); border-radius:6px; padding:11px 12px; background:var(--white); display:flex; gap:10px}
.bg.locked{opacity:.55; background:var(--lt)}
.bg .sh{
  flex:0 0 34px; height:34px; border-radius:5px; display:grid; place-items:center;
  font-family:var(--mono); font-weight:700; font-size:13px; color:#fff; background:var(--rule);
}
.bg.got .sh{background:var(--amb)}
.bg b{display:block; font-family:var(--disp); font-size:14px; color:var(--navy)}
.bg span{font-size:12.5px; color:var(--mute); line-height:1.35; display:block}

/* ---------- modal ---------- */
#modal{position:fixed; inset:0; background:rgba(14,31,46,.55); display:none; place-items:center; z-index:200; padding:18px}
#modal.on{display:grid}
#modalbox{background:var(--white); border:1px solid var(--rule); border-radius:8px; max-width:520px; width:100%; padding:22px; text-align:center; animation:pop .28s ease}
@keyframes pop{from{transform:scale(.92); opacity:0} to{transform:scale(1); opacity:1}}
#modalbox .em{
  width:56px;height:56px;margin:0 auto 12px;border-radius:8px;display:grid;place-items:center;
  background:var(--amb); color:#fff; font-family:var(--mono); font-size:19px; font-weight:700;
}

/* ---------- boss / drill ---------- */
.bosshd{background:var(--navy); color:#fff; border-radius:6px 6px 0 0; padding:13px 18px}
.bosshd h2{color:#fff; margin:0}
.bosshd .mt{font-family:var(--mono); font-size:12.5px; color:#9DB6D4; margin-top:3px}
.stage{display:flex; gap:5px; margin:12px 0}
.stage i{flex:1 1 0; height:5px; background:#E3E9EF; border-radius:3px; border:1px solid var(--rule)}
.stage i.on{background:var(--amb); border-color:var(--amb)}
.stage i.ok{background:var(--grn); border-color:var(--grn)}
.timer{font-family:var(--mono); font-size:14px; color:var(--mute)}

/* ---------- defect finder ---------- */
table.dt.pick tbody tr{cursor:pointer}
table.dt.pick tbody tr:hover{background:#EAF2F6}
table.dt.pick tbody tr.sel{background:#FCF8EF; box-shadow:inset 3px 0 0 var(--amb)}
table.dt.pick tbody tr.hit{background:#EFF8F3; box-shadow:inset 3px 0 0 var(--grn)}
table.dt.pick tbody tr.miss{background:#FCF2F1; box-shadow:inset 3px 0 0 var(--red)}
table.dt.pick tbody tr.was{box-shadow:inset 3px 0 0 var(--vio)}

/* ---------- sequence builder ---------- */
.seq{list-style:none; margin:0; padding:0; max-width:640px}
.seq li{
  display:flex; align-items:center; gap:10px; border:1px solid var(--rule); border-radius:5px;
  background:var(--white); padding:9px 12px; margin-bottom:7px; cursor:grab; font-size:14.5px;
}
.seq li.drag{opacity:.4}
.seq li.over{border-color:var(--teal); border-style:dashed}
.seq li .ord{font-family:var(--mono); font-weight:700; color:var(--mute); flex:0 0 22px}
.seq li .gr{margin-left:auto; color:var(--rule); font-family:var(--mono); letter-spacing:-2px}
.seq li.right{border-color:var(--grn); background:#F2F9F5}
.seq li.wrongp{border-color:var(--red); background:#FDF4F3}
.seq li:focus-visible{border-color:var(--amb)}

/* ---------- glossary ---------- */
.gloss{columns:2; column-gap:26px}
@media(max-width:820px){.gloss{columns:1}}
.gt{break-inside:avoid; margin-bottom:12px; border-left:3px solid var(--vio); padding-left:11px}
.gt b{font-family:var(--disp); color:var(--navy); font-size:14.5px; display:block}
.gt span{font-size:13.5px; color:var(--ink); line-height:1.45}
.gt .cat{font-family:var(--mono); font-size:10.5px; color:var(--vio); text-transform:uppercase; letter-spacing:.6px}
#gsearch{font-family:var(--body); font-size:15px; padding:8px 12px; border:1px solid var(--rule); border-radius:6px; width:100%; max-width:420px}

/* ---------- misc ---------- */
.pill{display:inline-block; font-family:var(--mono); font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--rule); color:var(--mute); background:var(--lt)}
.pill.l1{color:var(--teal); border-color:var(--teal); background:#F1F7FA}
.pill.l2{color:var(--grn); border-color:var(--grn); background:#F2F9F5}
.pill.l3{color:var(--amb); border-color:var(--amb); background:#FCF8EF}
.pill.l4{color:var(--red); border-color:var(--red); background:#FDF4F3}
.pill.done{color:var(--grn); border-color:var(--grn); background:#F2F9F5}
.lockmsg{border:1px dashed var(--rule); border-radius:6px; padding:26px; text-align:center; color:var(--mute); background:var(--white)}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1} 50%{opacity:.55}}
.tick{color:var(--grn); font-family:var(--mono); font-weight:700}
.cross{color:var(--red); font-family:var(--mono); font-weight:700}

@media(max-width:1080px){
  :root{--sbw:52px}
  .navi .lbl,.navi .dot,.brand span,.navgrp>h5{display:none}
  .brand{padding:12px 8px; text-align:center}
  .brand b{font-size:12px; letter-spacing:0}
  .navi{justify-content:center; padding:8px 4px}
  #view{padding:16px 14px 70px}
  #sidebar.open{position:fixed; left:0; top:0; width:236px; z-index:150; box-shadow:2px 0 12px rgba(0,0,0,.3)}
  #sidebar.open .navi .lbl,#sidebar.open .navi .dot,#sidebar.open .brand span,#sidebar.open .navgrp>h5{display:block}
  #sidebar.open .navi{justify-content:flex-start; padding:7px 14px}
  #menubtn{display:inline-block}
}
@media(max-width:620px){
  #topbar{padding:6px 10px; gap:8px}
  .chip .k{display:none}
  #xpwrap{flex-basis:100%; max-width:none; order:9}
}
@media print{
  #sidebar,#topbar,.no-print{display:none!important}
  #view{padding:0; max-width:none}
  body{background:#fff}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Main navigation">
    <div class="brand"><b>STRATUM LEARN</b><span>planning &amp; controls</span>
      <button id="backApp" class="navi" hidden style="margin-top:8px;padding-left:0">&larr; Back to Stratum</button></div>
    <div id="nav"></div>
  </nav>
  <div id="main">
    <header id="topbar">
      <button id="menubtn" aria-label="Toggle navigation">&#9776;</button>
      <span class="chip rank"><span class="k">Lessons read</span><span class="v" id="tbRead">0</span></span>
      <span class="chip"><span class="k">Checks</span><span class="v" id="tbChecks">0</span></span>
      <span class="chip"><span class="k">Level reviews</span><span class="v" id="tbReviews">0</span></span>
      <div id="xpwrap">
        <div class="lab"><span id="xpNext">course progress</span><span id="xpNum"></span></div>
        <div class="bar teal"><i id="xpBar"></i></div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalbox"></div></div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="content.js"></script>
<script src="widgets.js"></script>
<script src="course.js"></script>
<script>
/* Inside Stratum the course runs in a panel; this button returns to the app. */
(function(){
  var b = document.getElementById('backApp');
  if(!b || window.parent === window) return;
  b.hidden = false;
  b.onclick = function(){ window.parent.postMessage({ stratumLearn: 'close' }, location.origin); };
})();
</script>
</body>
</html>
